name: Build RiderTrack V2 APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --legacy-peer-deps react-is

      - name: Build React App
        run: npm run build



      - name: Add Android platform
        run: npx cap add android || true

      - name: Copy web assets to Android
        run: npx cap copy android

      - name: Sync Capacitor plugins
        run: npx cap sync android

      - name: Copy google-services.json to Android
        run: |
          if [ -f google-services.json ]; then
            cp google-services.json android/app/google-services.json
            echo "✅ google-services.json copiado a android/app/"
          else
            echo "⚠️ google-services.json NO encontrado en la raíz del repo"
          fi

      # F3.34: el template de Capacitor trae su robot como ícono —
      # android-icons/ (repo) tiene el escudo RiderTrack real en todas
      # las densidades + splash. Se copia ENCIMA del res/ generado por
      # `cap add android` para que TODA build salga con el logo de la v1.
      - name: Apply RiderTrack launcher icon + splash (F3.34)
        run: |
          if [ -d android-icons ]; then
            # 1) Borrar los splash por densidad del template Capacitor:
            #    si quedan, Android los prefiere (drawable-port-hdpi etc.)
            #    y saldría el splash default en vez del de RiderTrack.
            rm -rf android/app/src/main/res/drawable-port-hdpi \
                   android/app/src/main/res/drawable-port-mdpi \
                   android/app/src/main/res/drawable-port-xhdpi \
                   android/app/src/main/res/drawable-port-xxhdpi \
                   android/app/src/main/res/drawable-port-xxxhdpi \
                   android/app/src/main/res/drawable-land-hdpi \
                   android/app/src/main/res/drawable-land-mdpi \
                   android/app/src/main/res/drawable-land-xhdpi \
                   android/app/src/main/res/drawable-land-xxhdpi \
                   android/app/src/main/res/drawable-land-xxxhdpi
            # 2) Borrar los 2 vectores del robot Capacitor que quedan
            #    huérfanos (teal + foreground v24) por si algo los referencie
            rm -f android/app/src/main/res/drawable/ic_launcher_background.xml \
                  android/app/src/main/res/drawable-v24/ic_launcher_foreground.xml
            rmdir android/app/src/main/res/drawable-v24 2>/dev/null || true
            # 3) Nuestro escudo RiderTrack encima del res/ generado
            cp -r android-icons/. android/app/src/main/res/
            echo "✅ Ícono RiderTrack aplicado (launcher + round + adaptivo + splash)"
            echo "res/ final:"
            ls android/app/src/main/res/ | sort
          else
            echo "⚠️ android-icons/ NO existe — el APK saldrá con el ícono default de Capacitor"
          fi

      - name: Apply Google Services Gradle plugin
        run: |
          # Agregar plugin de Google Services al build.gradle del proyecto
          PROJECT_GRADLE="android/build.gradle"
          if ! grep -q "com.google.gms.google-services" "$PROJECT_GRADLE"; then
            sed -i '/buildscript {/a\    repositories { google() mavenCentral() }\n    dependencies { classpath "com.google.gms:google-services:4.4.2" }' "$PROJECT_GRADLE" || true
          fi
          # Agregar plugin al build.gradle del módulo app
          APP_GRADLE="android/app/build.gradle"
          if ! grep -q "com.google.gms.google-services" "$APP_GRADLE"; then
            echo 'apply plugin: "com.google.gms.google-services"' >> "$APP_GRADLE"
          fi

      - name: Configure GoogleAuth plugin
        run: |
          mkdir -p android/app/src/main/res/values
          echo '<?xml version="1.0" encoding="utf-8"?><resources><string name="app_name">RiderTrack V2</string><string name="title_activity_main">RiderTrack V2</string><string name="package_name">com.ridertrack.v2</string><string name="custom_url_scheme">com.ridertrack.v2</string><string name="server_client_id">851606828420-rm5mumtplpctk6p4cjh44mnttlnlmbfs.apps.googleusercontent.com</string></resources>' > android/app/src/main/res/values/strings.xml

      - name: Add Google Auth dependency to app build.gradle
        run: |
          GRADLE="android/app/build.gradle"
          sed -i '/dependencies {/a\    implementation "com.google.android.gms:play-services-auth:20.7.0"' "$GRADLE"

      - name: Update AndroidManifest permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n    <application|' "$MANIFEST"

      # F3.24: Capacitor 6 NO registra el deep link custom_url_scheme en el
      # manifest del template → la APK no escuchaba com.ridertrack.v2:// y el
      # callback de Spotify no volvía a la app. Se añade el intent-filter a mano.
      - name: Register deep link scheme (Spotify com.ridertrack.v2://callback)
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if grep -q 'android:scheme="com.ridertrack.v2"' "$MANIFEST"; then
            echo "ℹ️ El intent-filter del deep link ya existe — nada que hacer"
          else
            sed -i 's|</intent-filter>|</intent-filter>\n            <intent-filter>\n                <action android:name="android.intent.action.VIEW" />\n                <category android:name="android.intent.category.DEFAULT" />\n                <category android:name="android.intent.category.BROWSABLE" />\n                <data android:scheme="com.ridertrack.v2" />\n            </intent-filter>|' "$MANIFEST"
            if grep -q 'android:scheme="com.ridertrack.v2"' "$MANIFEST"; then
              echo "✅ Deep link com.ridertrack.v2:// registrado en el manifest"
            else
              echo "❌ FALLO al insertar el intent-filter" && exit 1
            fi
          fi

      - name: Set Gradle permissions
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Restore or generate keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "✅ Usando keystore guardado en Secrets"
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          else
            echo "⚠️ No hay KEYSTORE_BASE64 — generando nuevo keystore"
            keytool -genkeypair \
              -keystore release.keystore \
              -alias ridertrack \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass ridertrack123 \
              -keypass ridertrack123 \
              -dname "CN=RiderTrack, OU=Dev, O=RiderTrack, L=Lima, S=Lima, C=PE"
            echo "SHA-1 del keystore nuevo:"
            keytool -list -v -keystore release.keystore -alias ridertrack -storepass ridertrack123 | grep "SHA1:"
          fi

      - name: Zipalign APK
        run: |
          ZIPALIGN=$(find $ANDROID_SDK_ROOT -name "zipalign" | head -1)
          $ZIPALIGN -v -p 4 android/app/build/outputs/apk/debug/app-debug.apk RiderTrackV2-aligned.apk

      - name: Sign APK
        run: |
          APKSIGNER=$(find $ANDROID_SDK_ROOT -name "apksigner" | head -1)
          $APKSIGNER sign --ks release.keystore --ks-key-alias ridertrack --ks-pass pass:ridertrack123 --key-pass pass:ridertrack123 --out RiderTrackV2.apk RiderTrackV2-aligned.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: RiderTrackV2-APK
          path: RiderTrackV2.apk
          retention-days: 30
